name: Build Windows installer

on:
  push:
    tags: ["v*"]
  release:
    types: [published]
  pull_request:
    paths:
      - '.github/workflows/build-windows-installer.yml'
      - 'build-installer.bat'
      - 'packaging/**'
      - 'cuvyro/**'
      - 'main.py'
      - 'requirements.txt'
      - 'tests/**'
  workflow_dispatch:
    inputs:
      package:
        description: Windows package or Store access check
        type: choice
        options: [installer, msix, check-store-access]
        default: installer
      store_version:
        description: MSIX version (major.minor.patch.0)
        default: '1.6.2.0'

permissions:
  contents: read

jobs:
  build:
    if: >-
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
      && (github.event_name != 'release' || !github.event.release.prerelease)
      && (github.event_name != 'workflow_dispatch' || inputs.package != 'check-store-access')
      && (github.ref_type != 'tag' || !contains(github.ref_name, '-'))
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      store_version: ${{ steps.version.outputs.store_version }}
      store_sha256: ${{ steps.msix.outputs.sha256 }}
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Microsoft Store submission behavior
        run: tests/check_store_submission.ps1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Resolve version
        id: version
        env:
          DISPATCH_STORE_VERSION: ${{ inputs.store_version || '1.6.2.0' }}
        run: |
          $version = '0.0.0-dev'
          $storeVersion = $env:DISPATCH_STORE_VERSION
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            if ($env:GITHUB_REF_NAME -cnotmatch '^v([1-9][0-9]{0,4})\.(0|[1-9][0-9]{0,4})\.(0|[1-9][0-9]{0,4})$') {
              throw 'Use a stable tag in the form vMAJOR.MINOR.PATCH.'
            }
            $version = $env:GITHUB_REF_NAME.Substring(1)
            $storeVersion = "$version.0"
            foreach ($component in $version.Split('.')) {
              if ([int]$component -gt 65535) { throw 'A version component exceeds 65535.' }
            }
          }
          "VERSION=$version" >> $env:GITHUB_ENV
          "version=$version" >> $env:GITHUB_OUTPUT
          "store_version=$storeVersion" >> $env:GITHUB_OUTPUT
          Write-Host "Building version $version (Store $storeVersion)"

      # A stable release must carry the archived result of the eight-hour soak.
      - name: Require archived soak evidence
        if: github.ref_type == 'tag' && inputs.package != 'msix'
        run: |
          $report = "docs/release/$env:VERSION-soak-result.json"
          if (-not (Test-Path $report)) {
            throw "No soak evidence for $env:VERSION. Archive docs/release/$env:VERSION-soak-result.json from a packaged run."
          }
          $soak = Get-Content $report -Raw | ConvertFrom-Json
          if ($soak.status -ne 'PASS') { throw "The archived soak for $env:VERSION is $($soak.status), not PASS." }
          $required = [double]$soak.required_seconds
          $elapsed = [double]$soak.elapsed_seconds
          if (-not [double]::IsFinite($required) -or $required -lt 28800) {
            throw "The archived soak requires $required s. Expected at least 28,800 s."
          }
          if (-not [double]::IsFinite($elapsed) -or $elapsed -lt $required) {
            throw "The archived soak reports $elapsed s of $required s."
          }
          $hashes = $soak.files_sha256.PSObject.Properties
          $hashed = ($hashes | Measure-Object).Count
          if ($soak.files_sha256 -isnot [PSCustomObject] -or $hashed -eq 0 -or
              ($hashes | Where-Object { $_.Value -isnot [string] -or $_.Value -notmatch '^[0-9a-fA-F]{64}$' })) {
            throw "The archived soak must contain a valid SHA-256 manifest."
          }
          Write-Host "Soak evidence: PASS, $($soak.elapsed_seconds) s, $hashed packaged files hashed"

      # The app ships and is measured against sherpa-onnx zipformer + Silero
      # VAD. model/ is not tracked, so the runner has to fetch every file the
      # build expects; fetching only the Vosk fallback published an installer
      # running the engine the benchmark replaced (4.3x realtime, RMS gate).
      - name: Fetch speech models
        run: |
          $ProgressPreference = 'SilentlyContinue'
          $zip = Join-Path $env:RUNNER_TEMP 'vosk-model.zip'
          Invoke-WebRequest -Uri 'https://alphacephei.com/vosk/models/vosk-model-small-en-us-0.15.zip' -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $env:RUNNER_TEMP -Force
          if (Test-Path 'model') { Remove-Item -Recurse -Force 'model' }
          Move-Item (Join-Path $env:RUNNER_TEMP 'vosk-model-small-en-us-0.15') 'model'

          $archive = Join-Path $env:RUNNER_TEMP 'sherpa.tar.bz2'
          Invoke-WebRequest -Uri 'https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/sherpa-onnx-streaming-zipformer-en-2023-06-26.tar.bz2' -OutFile $archive
          tar.exe -xjf $archive -C $env:RUNNER_TEMP
          if ($LASTEXITCODE -ne 0) { throw 'could not extract the sherpa model archive' }
          Move-Item (Join-Path $env:RUNNER_TEMP 'sherpa-onnx-streaming-zipformer-en-2023-06-26') (Join-Path 'model' 'sherpa')

          $vad = Join-Path 'model' 'silero_vad.onnx'
          Invoke-WebRequest -Uri 'https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/silero_vad.onnx' -OutFile $vad
          if ((Get-Item $vad).Length -lt 500KB) { throw 'silero_vad.onnx is truncated' }

          # The build prefers sherpa; assert the files it needs actually landed.
          if (-not (Test-Path 'model/sherpa/tokens.txt')) { throw 'model/sherpa/tokens.txt is missing' }
          if (-not (Get-ChildItem 'model/sherpa' -Filter '*encoder*.onnx')) { throw 'sherpa encoder is missing' }
          Write-Host "Model ready: $(Get-ChildItem model | Measure-Object | Select-Object -ExpandProperty Count) entries"

      # Head tracking ships the MediaPipe landmarker beside the speech model,
      # and model/ is not tracked, so the runner has to fetch it as well.
      - name: Fetch face landmark model
        run: |
          $dest = Join-Path 'model' 'face_landmarker.task'
          Invoke-WebRequest -Uri 'https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task' -OutFile $dest
          $size = (Get-Item $dest).Length
          if ($size -lt 1MB) { throw "face landmarker is truncated: $size bytes" }
          Write-Host "Face landmarker ready: $size bytes"

      - name: Freeze application
        shell: cmd
        run: build-installer.bat %VERSION% --freeze-only

      # A tag used to publish without running anything. These are the checks
      # the README documents as offscreen-safe, so a behavioural regression
      # cannot reach the installer. check_diagnostics is included because the
      # only support evidence a windowed build leaves behind is its log: a
      # frozen build that stopped writing one would otherwise ship silently.
      # A check that blocks holds the job to the six-hour limit, and a tag that
      # dies there publishes nothing at all. Each check therefore runs with a
      # five-minute cap and unbuffered output: a hang names the check and leaves
      # the line it stopped on, instead of a silent gap behind a group header.
      - name: Run offscreen checks
        run: |
          $env:QT_QPA_PLATFORM = 'offscreen'
          $checks = @(
            'check_behavior', 'check_voice_follow', 'check_waveform',
            'check_speech_engine', 'check_robustness', 'check_note_clearing',
            'check_note_placement', 'check_motion', 'check_upgrades',
            'check_head_tracking', 'check_storage', 'check_diagnostics',
            'check_predictive_highlight', 'check_predictive_speech',
            'check_signing'
          )
          $failed = @()
          foreach ($check in $checks) {
            Write-Host "::group::$check"
            $proc = Start-Process -FilePath '.venv/Scripts/python.exe' -NoNewWindow -PassThru `
              -ArgumentList '-u', "tests/$check.py"
            if (-not $proc.WaitForExit(300000)) {
              & taskkill.exe /PID $proc.Id /T /F | Out-Null
              Write-Host '::endgroup::'
              Write-Host "::error::$check did not finish within 300 seconds"
              $failed += "$check (hang)"
              continue
            }
            $proc.WaitForExit()
            $code = $proc.ExitCode
            Write-Host '::endgroup::'
            if ($code -ne 0) {
              Write-Host "::error::$check failed with exit code $code"
              $failed += $check
            }
          }
          # One run reports every broken check, so a fix does not have to wait
          # for a runner to discover the next one.
          if ($failed.Count -gt 0) {
            throw "checks failed: $($failed -join ', ')"
          }

      # The frozen tree must carry the same models the checks just exercised.
      # build-installer.bat still accepts a Vosk-only folder for legacy local
      # builds, so the release asserts the shipping configuration explicitly.
      - name: Verify the frozen build carries the tested engines
        run: |
          $required = @(
            'dist/Cuvyro/model/sherpa/tokens.txt',
            'dist/Cuvyro/model/silero_vad.onnx',
            'dist/Cuvyro/model/face_landmarker.task'
          )
          foreach ($path in $required) {
            if (-not (Test-Path $path)) { throw "release build is missing $path" }
          }
          foreach ($component in @('encoder', 'decoder', 'joiner')) {
            if (-not (Get-ChildItem 'dist/Cuvyro/model/sherpa' -Filter "*${component}*.onnx")) {
              throw "Frozen build has no sherpa $component"
            }
          }
          Write-Host 'Frozen models verified'

      - name: Build Store MSIX
        if: github.ref_type == 'tag' || github.event_name == 'pull_request' || inputs.package == 'msix'
        id: msix
        env:
          STORE_VERSION: ${{ steps.version.outputs.store_version }}
        run: |
          .venv/Scripts/python.exe -m pip install Pillow
          if ($LASTEXITCODE -ne 0) { throw 'Could not install Pillow' }
          .venv/Scripts/python.exe packaging/build-msix.py $env:STORE_VERSION
          if ($LASTEXITCODE -ne 0) { throw 'MSIX build failed' }
          $package = "dist/Cuvyro-$env:STORE_VERSION-x64.msix"
          $sha256 = (Get-FileHash -LiteralPath $package -Algorithm SHA256).Hash
          "sha256=$sha256" >> $env:GITHUB_OUTPUT

      - name: Upload Store MSIX
        if: steps.msix.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: Cuvyro-Store-MSIX-x64
          path: dist/Cuvyro-${{ steps.version.outputs.store_version }}-x64.msix
          if-no-files-found: error
          retention-days: 30

      - name: Build development installer
        if: github.ref_type != 'tag' && github.event_name == 'workflow_dispatch' && inputs.package == 'installer'
        shell: cmd
        run: build-installer.bat %VERSION% --installer-only

      - name: Upload development installer
        if: github.ref_type != 'tag' && github.event_name == 'workflow_dispatch' && inputs.package == 'installer'
        uses: actions/upload-artifact@v4
        with:
          name: CuvyroSetup-windows-x64
          path: dist/CuvyroSetup-${{ steps.version.outputs.version }}.exe
          if-no-files-found: error
          retention-days: 30

      - name: Archive the frozen payload for signing
        if: github.ref_type == 'tag' && github.event_name != 'release' && inputs.package != 'msix'
        run: |
          tar.exe -cf Cuvyro-frozen.tar -C dist Cuvyro
          if ($LASTEXITCODE -ne 0) { throw 'Could not archive the frozen payload' }

      - name: Upload frozen payload
        if: github.ref_type == 'tag' && github.event_name != 'release' && inputs.package != 'msix'
        uses: actions/upload-artifact@v4
        with:
          name: Cuvyro-frozen
          path: Cuvyro-frozen.tar
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  sign_installer:
    if: github.ref_type == 'tag' && github.event_name != 'release' && inputs.package != 'msix'
    needs: build
    runs-on: ${{ vars.CUVYRO_SIGN_RUNNER || 'windows-latest' }}
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    env:
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: Cuvyro-frozen
          path: ${{ runner.temp }}/cuvyro-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Extract the frozen payload
        env:
          PAYLOAD: ${{ runner.temp }}/cuvyro-${{ github.run_id }}-${{ github.run_attempt }}/Cuvyro-frozen.tar
        run: |
          if (Test-Path dist) { Remove-Item dist -Recurse -Force }
          New-Item -ItemType Directory dist | Out-Null
          tar.exe -xf $env:PAYLOAD -C dist
          if ($LASTEXITCODE -ne 0) { throw 'Could not extract the frozen payload' }

      - name: Sign the application and installer
        env:
          CUVYRO_SIGN_REQUIRED: '1'
          CUVYRO_SIGN_THUMBPRINT: ${{ vars.CUVYRO_SIGN_THUMBPRINT }}
          CUVYRO_SIGN_PASSWORD: ${{ secrets.NOTCH_SIGN_CERT_PASSWORD }}
          SIGN_PFX: ${{ secrets.NOTCH_SIGN_CERT_PFX }}
        run: |
          $certPath = Join-Path $env:RUNNER_TEMP ("cuvyro-" + [guid]::NewGuid() + ".pfx")
          try {
            if ($env:CUVYRO_SIGN_THUMBPRINT) {
              if ($env:CUVYRO_SIGN_THUMBPRINT -notmatch '^[0-9a-fA-F]{40}$') {
                throw 'CUVYRO_SIGN_THUMBPRINT must be a 40-character certificate thumbprint.'
              }
            } elseif ($env:SIGN_PFX) {
              [IO.File]::WriteAllBytes($certPath, [Convert]::FromBase64String($env:SIGN_PFX))
              $env:CUVYRO_SIGN_CERT = $certPath
            } else {
              throw 'Configure a provider-backed certificate for GitHub EXE releases.'
            }
            Remove-Item Env:SIGN_PFX -ErrorAction SilentlyContinue
            & cmd.exe /d /c build-installer.bat $env:VERSION --installer-only
            if ($LASTEXITCODE -ne 0) { throw 'Signed installer build failed.' }
          } finally {
            if (Test-Path -LiteralPath $certPath) { Remove-Item -Force -LiteralPath $certPath }
          }

      - name: Verify Authenticode signatures
        env:
          SIGN_THUMBPRINT: ${{ vars.CUVYRO_SIGN_THUMBPRINT }}
        run: |
          foreach ($file in @('dist/Cuvyro/Cuvyro.exe', "dist/CuvyroSetup-$env:VERSION.exe")) {
            $sig = Get-AuthenticodeSignature -LiteralPath $file
            if ($sig.Status -ne 'Valid' -or !$sig.SignerCertificate -or !$sig.TimeStamperCertificate) {
              throw "$file has no valid, timestamped Authenticode signature ($($sig.Status))."
            }
            if ($env:SIGN_THUMBPRINT -and $sig.SignerCertificate.Thumbprint -ne $env:SIGN_THUMBPRINT) {
              throw "$file was signed by a different certificate."
            }
            Write-Host ("signed: {0} by {1}" -f (Split-Path $file -Leaf), $sig.SignerCertificate.Subject)
          }

      - name: Upload signed installer
        uses: actions/upload-artifact@v4
        with:
          name: CuvyroSetup-windows-x64
          path: dist/CuvyroSetup-${{ needs.build.outputs.version }}.exe
          if-no-files-found: error
          retention-days: 30

      - name: Remove the temporary frozen payload
        if: always()
        env:
          PAYLOAD_DIR: ${{ runner.temp }}/cuvyro-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          if (Test-Path -LiteralPath $env:PAYLOAD_DIR) {
            Remove-Item -LiteralPath $env:PAYLOAD_DIR -Recurse -Force
          }

  github_release:
    needs: [build, sign_installer]
    runs-on: windows-latest
    permissions:
      contents: write
    outputs:
      published: ${{ steps.release_status.outputs.published }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: CuvyroSetup-windows-x64
          path: dist
      - name: Attach signed installer to release
        uses: softprops/action-gh-release@v2
        with:
          name: Cuvyro ${{ github.ref_name }}
          files: dist/CuvyroSetup-${{ needs.build.outputs.version }}.exe
          generate_release_notes: true
          fail_on_unmatched_files: true
      - name: Check the GitHub release is published
        id: release_status
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $published = gh api "repos/$env:GITHUB_REPOSITORY/releases/tags/$env:GITHUB_REF_NAME" --jq '(.draft == false and .prerelease == false)'
          if ($LASTEXITCODE -ne 0) { throw 'Could not verify the GitHub release status.' }
          "published=$published" >> $env:GITHUB_OUTPUT

  store_submission:
    # GITHUB_TOKEN-created releases do not emit a new Actions run. A human
    # publishing a stable release reaches this job through the release event.
    if: >-
      !cancelled() && needs.build.result == 'success'
      && (github.event_name == 'release' || needs.github_release.outputs.published == 'true')
    needs: [build, github_release]
    runs-on: windows-latest
    timeout-minutes: 45
    concurrency:
      group: cuvyro-store-9MX46V9WW83Q
      queue: max
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: Cuvyro-Store-MSIX-x64
          path: dist
      - name: Verify the tagged GitHub release is still published and stable
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $published = gh api "repos/$env:GITHUB_REPOSITORY/releases/tags/$env:GITHUB_REF_NAME" --jq '(.draft == false and .prerelease == false)'
          if ($LASTEXITCODE -ne 0 -or $published -ne 'true') {
            throw "The GitHub release must be published and stable at submission time."
          }
      - name: Submit the verified MSIX for certification
        env:
          STORE_VERSION: ${{ needs.build.outputs.store_version }}
          STORE_SHA256: ${{ needs.build.outputs.store_sha256 }}
          STORE_TENANT_ID: ${{ secrets.STORE_TENANT_ID }}
          STORE_CLIENT_ID: ${{ secrets.STORE_CLIENT_ID }}
          STORE_CLIENT_SECRET: ${{ secrets.STORE_CLIENT_SECRET }}
        run: packaging/publish-store.ps1

  store_access:
    if: github.event_name == 'workflow_dispatch' && inputs.package == 'check-store-access'
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify read access to the live Cuvyro submission
        shell: pwsh
        env:
          STORE_TENANT_ID: ${{ secrets.STORE_TENANT_ID }}
          STORE_CLIENT_ID: ${{ secrets.STORE_CLIENT_ID }}
          STORE_CLIENT_SECRET: ${{ secrets.STORE_CLIENT_SECRET }}
        run: packaging/publish-store.ps1 -CheckAccess
