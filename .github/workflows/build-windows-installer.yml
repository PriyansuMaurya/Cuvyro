name: Build Windows installer

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Resolve version
        run: |
          $version = if ('${{ github.ref_type }}' -eq 'tag') {
            '${{ github.ref_name }}'.TrimStart('v')
          } else {
            '0.0.0-dev'
          }
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Building version $version"

      # A tag used to publish whatever the runner produced. The eight-hour soak
      # cannot run on a hosted runner, so the report is archived in the
      # repository instead and this step refuses a tag that has none. A
      # dispatch build has no version yet and is not held to it.
      - name: Require archived soak evidence
        if: github.ref_type == 'tag'
        run: |
          $report = "docs/release/$env:VERSION-soak-result.json"
          if (-not (Test-Path $report)) {
            throw "No soak evidence for $env:VERSION. Archive docs/release/$env:VERSION-soak-result.json from a packaged run."
          }
          $soak = Get-Content $report -Raw | ConvertFrom-Json
          if ($soak.status -ne 'PASS') { throw "The archived soak for $env:VERSION is $($soak.status), not PASS." }
          if ([double]$soak.required_seconds -lt 28800) {
            throw "The archived soak asked for $($soak.required_seconds) s, not the 28,800 a release requires."
          }
          if ([double]$soak.elapsed_seconds -lt [double]$soak.required_seconds) {
            throw "The archived soak ran $($soak.elapsed_seconds) s of $($soak.required_seconds)."
          }
          $hashed = ($soak.files_sha256.PSObject.Properties | Measure-Object).Count
          if ($hashed -lt 1) { throw "The archived soak carries no packaged-file manifest." }
          Write-Host "Soak evidence: PASS, $($soak.elapsed_seconds) s, $hashed packaged files hashed"

      # The app ships and is measured against sherpa-onnx zipformer + Silero
      # VAD. model/ is not tracked, so the runner has to fetch every file the
      # build expects; fetching only the Vosk fallback published an installer
      # running the engine the benchmark replaced (4.3x realtime, RMS gate).
      - name: Fetch speech models
        run: |
          $ProgressPreference = 'SilentlyContinue'
          $zip = Join-Path $env:RUNNER_TEMP 'vosk-model.zip'
          Invoke-WebRequest -Uri 'https://alphacephei.com/vosk/models/vosk-model-small-en-us-0.15.zip' -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $env:RUNNER_TEMP -Force
          if (Test-Path 'model') { Remove-Item -Recurse -Force 'model' }
          Move-Item (Join-Path $env:RUNNER_TEMP 'vosk-model-small-en-us-0.15') 'model'

          $archive = Join-Path $env:RUNNER_TEMP 'sherpa.tar.bz2'
          Invoke-WebRequest -Uri 'https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/sherpa-onnx-streaming-zipformer-en-2023-06-26.tar.bz2' -OutFile $archive
          tar.exe -xjf $archive -C $env:RUNNER_TEMP
          if ($LASTEXITCODE -ne 0) { throw 'could not extract the sherpa model archive' }
          Move-Item (Join-Path $env:RUNNER_TEMP 'sherpa-onnx-streaming-zipformer-en-2023-06-26') (Join-Path 'model' 'sherpa')

          $vad = Join-Path 'model' 'silero_vad.onnx'
          Invoke-WebRequest -Uri 'https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/silero_vad.onnx' -OutFile $vad
          if ((Get-Item $vad).Length -lt 500KB) { throw 'silero_vad.onnx is truncated' }

          # The build prefers sherpa; assert the files it needs actually landed.
          if (-not (Test-Path 'model/sherpa/tokens.txt')) { throw 'model/sherpa/tokens.txt is missing' }
          if (-not (Get-ChildItem 'model/sherpa' -Filter '*encoder*.onnx')) { throw 'sherpa encoder is missing' }
          Write-Host "Model ready: $(Get-ChildItem model | Measure-Object | Select-Object -ExpandProperty Count) entries"

      # Head tracking ships the MediaPipe landmarker beside the speech model,
      # and model/ is not tracked, so the runner has to fetch it as well.
      - name: Fetch face landmark model
        run: |
          $dest = Join-Path 'model' 'face_landmarker.task'
          Invoke-WebRequest -Uri 'https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task' -OutFile $dest
          $size = (Get-Item $dest).Length
          if ($size -lt 1MB) { throw "face landmarker is truncated: $size bytes" }
          Write-Host "Face landmarker ready: $size bytes"

      # A tag used to publish without running anything. These are the checks
      # the README documents as offscreen-safe, so a behavioural regression
      # cannot reach the installer. check_diagnostics is included because the
      # only support evidence a windowed build leaves behind is its log: a
      # frozen build that stopped writing one would otherwise ship silently.
      - name: Install check dependencies
        run: python -m pip install -r requirements.txt

      # A check that blocks holds the job to the six-hour limit, and a tag that
      # dies there publishes nothing at all. Each check therefore runs with a
      # five-minute cap and unbuffered output: a hang names the check and leaves
      # the line it stopped on, instead of a silent gap behind a group header.
      - name: Run offscreen checks
        run: |
          $env:QT_QPA_PLATFORM = 'offscreen'
          $checks = @(
            'check_behavior', 'check_voice_follow', 'check_waveform',
            'check_speech_engine', 'check_robustness', 'check_note_clearing',
            'check_note_placement', 'check_motion', 'check_upgrades',
            'check_head_tracking', 'check_storage', 'check_diagnostics',
            'check_predictive_highlight', 'check_predictive_speech',
            'check_signing'
          )
          foreach ($check in $checks) {
            Write-Host "::group::$check"
            $proc = Start-Process -FilePath 'python' -NoNewWindow -PassThru `
              -ArgumentList '-u', "tests/$check.py"
            if (-not $proc.WaitForExit(300000)) {
              & taskkill.exe /PID $proc.Id /T /F | Out-Null
              Write-Host '::endgroup::'
              throw "$check did not finish within 300 seconds"
            }
            $proc.WaitForExit()
            $code = $proc.ExitCode
            Write-Host '::endgroup::'
            if ($code -ne 0) { throw "$check failed with exit code $code" }
          }

      # Signing material never goes into the repository. A tag build restores
      # the certificate from secrets, signs through packaging/sign.bat, and
      # deletes it afterwards. Without the secret a tag fails here rather than
      # publishing an installer nobody can attribute.
      - name: Restore signing certificate
        if: github.ref_type == 'tag'
        env:
          SIGN_PFX: ${{ secrets.NOTCH_SIGN_CERT_PFX }}
          SIGN_PASSWORD: ${{ secrets.NOTCH_SIGN_CERT_PASSWORD }}
        run: |
          if (-not $env:SIGN_PFX) {
            throw 'NOTCH_SIGN_CERT_PFX is not configured; a tag cannot publish an unsigned installer.'
          }
          $path = Join-Path $env:RUNNER_TEMP 'notch-signing.pfx'
          [IO.File]::WriteAllBytes($path, [Convert]::FromBase64String($env:SIGN_PFX))
          if ((Get-Item $path).Length -lt 1) { throw 'the restored certificate is empty' }
          "NOTCH_SIGN_CERT=$path" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "NOTCH_SIGN_PASSWORD=$env:SIGN_PASSWORD" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          'NOTCH_SIGN_REQUIRED=1' | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host 'Signing certificate restored'

      # Same one-command flow used locally; version comes from the tag. The
      # build script signs dist/Notch/Notch.exe before Inno Setup runs and the
      # installer afterwards, which is the order the verification expects.
      - name: Build installer
        shell: cmd
        run: build-installer.bat %VERSION%

      # The frozen tree must carry the same models the checks just exercised.
      # build-installer.bat still accepts a Vosk-only folder for legacy local
      # builds, so the release asserts the shipping configuration explicitly.
      - name: Verify the frozen build carries the tested engines
        run: |
          $required = @(
            'dist/Notch/model/sherpa/tokens.txt',
            'dist/Notch/model/silero_vad.onnx',
            'dist/Notch/model/face_landmarker.task'
          )
          foreach ($path in $required) {
            if (-not (Test-Path $path)) { throw "release build is missing $path" }
          }
          $encoder = Get-ChildItem 'dist/Notch/model/sherpa' -Filter '*encoder*.onnx'
          if (-not $encoder) { throw 'release build has no sherpa encoder' }
          Write-Host "Frozen models verified: $(($required + $encoder.FullName).Count) files"

      - name: Verify installer exists
        run: |
          $exe = Get-ChildItem 'dist/NotchSetup-*.exe' -ErrorAction SilentlyContinue
          if (-not $exe) { throw 'No installer produced' }
          $exe | ForEach-Object { Write-Host ("{0}  {1:N1} MB" -f $_.Name, ($_.Length / 1MB)) }

      # Signing is worthless if nobody checks it: verify both artifacts, and
      # require a timestamp so the signature outlives the certificate.
      - name: Verify Authenticode signatures
        if: github.ref_type == 'tag'
        run: |
          $files = @('dist/Notch/Notch.exe') + @(Get-ChildItem 'dist/NotchSetup-*.exe' | ForEach-Object FullName)
          foreach ($file in $files) {
            $sig = Get-AuthenticodeSignature $file
            if ($sig.Status -ne 'Valid') { throw "$file is not validly signed: $($sig.Status)" }
            if (-not $sig.SignerCertificate) { throw "$file has no signer certificate" }
            if (-not $sig.TimeStamperCertificate) { throw "$file carries no timestamp" }
            Write-Host ("signed: {0} by {1}" -f (Split-Path $file -Leaf), $sig.SignerCertificate.Subject)
          }

      - name: Remove signing certificate
        if: always() && github.ref_type == 'tag'
        run: |
          $path = Join-Path $env:RUNNER_TEMP 'notch-signing.pfx'
          if (Test-Path $path) { Remove-Item -Force $path }
          Write-Host 'Signing certificate removed'

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: NotchSetup-windows-x64
          path: dist/NotchSetup-*.exe
          if-no-files-found: error
          retention-days: 30

      - name: Attach installer to release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/NotchSetup-*.exe
          generate_release_notes: true
          fail_on_unmatched_files: true
